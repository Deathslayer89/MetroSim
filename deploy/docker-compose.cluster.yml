# MetroSim 3-broker Kafka cluster (KRaft). Replication factor 3, min-ISR 2, so
# the producer's acks=all is a real durability guarantee: a write needs 2 of 3
# replicas, surviving a single-broker loss. Kill one broker mid-run and produces
# keep committing; kill two and they fail (ISR < min.insync.replicas).
#
#   docker compose -f deploy/docker-compose.cluster.yml up -d
#   go run ./cmd/metrosim --bus=kafka \
#       --kafka-seeds=localhost:9092,localhost:9094,localhost:9096 \
#       --scenario=scenarios/smoke.yaml
#
# Heavier than the single-broker stack (3 JVMs). Use docker-compose.yml for
# quick dev; use this when you want to demo durability under broker loss.
x-broker-env: &broker-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_NUM_PARTITIONS: "4"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  # Durability: every replicated topic spans all 3 brokers; a write needs 2.
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"

services:
  kafka1:
    image: apache/kafka:3.8.0
    container_name: metrosim_kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9092
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka2:
    image: apache/kafka:3.8.0
    container_name: metrosim_kafka2
    ports:
      - "9094:9094"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://localhost:9094
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9094"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka3:
    image: apache/kafka:3.8.0
    container_name: metrosim_kafka3
    ports:
      - "9096:9096"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9096,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:29092,PLAINTEXT_HOST://localhost:9096
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9096"]
      interval: 5s
      timeout: 3s
      retries: 30

  trace-writer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BINARY: trace-writer
    container_name: metrosim_trace_writer
    command:
      - "--kafka-seeds=kafka1:29092,kafka2:29092,kafka3:29092"
      - "--out-dir=/traces"
    volumes:
      - ../traces:/traces
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy

  metrics-aggregator-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BINARY: metrics-aggregator
    container_name: metrosim_metrics_1
    command:
      - "--kafka-seeds=kafka1:29092,kafka2:29092,kafka3:29092"
      - "--addr=:9100"
    ports:
      - "9101:9100"
    depends_on:
      kafka1:
        condition: service_healthy

  metrics-aggregator-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BINARY: metrics-aggregator
    container_name: metrosim_metrics_2
    command:
      - "--kafka-seeds=kafka1:29092,kafka2:29092,kafka3:29092"
      - "--addr=:9100"
    ports:
      - "9102:9100"
    depends_on:
      kafka1:
        condition: service_healthy

  live-view:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BINARY: live-view
    container_name: metrosim_live_view
    command:
      - "--kafka-seeds=kafka1:29092,kafka2:29092,kafka3:29092"
      - "--addr=:8080"
      - "--static=/static"
    ports:
      - "8080:8080"
    volumes:
      - ../web/static:/static:ro
    depends_on:
      kafka1:
        condition: service_healthy
