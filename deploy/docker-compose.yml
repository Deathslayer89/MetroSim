# MetroSim local stack: Kafka in KRaft mode, trace-writer, two
# metrics-aggregators, live-view, Prometheus and Grafana. Start it with
# `make stack-up`.
#
# Kafka has two listeners:
#   PLAINTEXT       kafka:29092      services inside this compose network
#   PLAINTEXT_HOST  localhost:9092   metrosim running on the host
#
#   make stack-up
#   go run ./cmd/metrosim --bus=kafka --osm data/osm/city.osm.pbf --scenario scenarios/downtown.yaml
#   curl http://localhost:9101/metrics
#   open http://localhost:3000 for the Grafana dashboard
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: metrosim_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 3s
      retries: 20

  trace-writer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BINARY: trace-writer
    container_name: metrosim_trace_writer
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command:
      - "--kafka-seeds=kafka:29092"
      - "--out-dir=/traces"
    volumes:
      - ../traces:/traces
    depends_on:
      kafka:
        condition: service_healthy

  metrics-aggregator-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BINARY: metrics-aggregator
    container_name: metrosim_metrics_1
    command:
      - "--kafka-seeds=kafka:29092"
      - "--addr=:9100"
    ports:
      - "9101:9100"
    depends_on:
      kafka:
        condition: service_healthy

  metrics-aggregator-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BINARY: metrics-aggregator
    container_name: metrosim_metrics_2
    command:
      - "--kafka-seeds=kafka:29092"
      - "--addr=:9100"
    ports:
      - "9102:9100"
    depends_on:
      kafka:
        condition: service_healthy

  live-view:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BINARY: live-view
    container_name: metrosim_live_view
    command:
      - "--kafka-seeds=kafka:29092"
      - "--addr=:8080"
      - "--static=/static"
    ports:
      - "8080:8080"
    volumes:
      - ../web/static:/static:ro
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: metrosim_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - metrics-aggregator-1
      - metrics-aggregator-2

  grafana:
    image: grafana/grafana:12.0.0
    container_name: metrosim_grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/marketplace_health.json
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/metrosim.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/metrosim.yml:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
